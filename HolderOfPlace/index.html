<title>Unity Web Player | HolderOfPlace</title>

<style>
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: #000;
    }

    body {
        text-align: center;
    }

    /* ================================
       LOADING SCREEN
       ================================ */

    #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;
        color: #fff;

        font-family: Arial, sans-serif;

        opacity: 1;
        transition: opacity 0.3s ease;
    }

    #loading-container {
        width: min(500px, 80vw);
        text-align: center;
    }

    #loading-title {
        font-size: 28px;
        margin-bottom: 20px;
    }

    #loading-bar {
        width: 100%;
        height: 20px;

        background: #222;
        border-radius: 10px;

        overflow: hidden;
    }

    #loading-progress {
        width: 0%;
        height: 100%;

        background: #fff;

        transition: width 0.15s linear;
    }

    #loading-status {
        margin-top: 12px;

        font-size: 14px;
        opacity: 0.8;
    }

    #loading-percent {
        margin-top: 5px;

        font-size: 13px;
        opacity: 0.6;
    }

    /* ================================
       UNITY CANVAS
       ================================ */

    #unity-canvas {
        width: 1680px;
        height: 945px;

        background: #000;
    }
</style>

```
<!-- ================================
     LOADING SCREEN
     ================================ -->

<div id="loading-screen">
    <div id="loading-container">

        <div id="loading-title">
            Loading...
        </div>

        <div id="loading-bar">
            <div id="loading-progress"></div>
        </div>

        <div id="loading-status">
            Preparing game...
        </div>

        <div id="loading-percent">
            0%
        </div>

    </div>
</div>


<!-- ================================
     UNITY CANVAS
     ================================ -->

<canvas
    id="unity-canvas"
    width="1680"
    height="945"
    tabindex="-1">
</canvas>


<!-- ================================
     UNITY LOADER
     
     IMPORTANT:
     This MUST load BEFORE
     createUnityInstance() is called.
     ================================ -->

<script src="Build/V16.76.loader.js"></script>


<!-- ================================
     UNITY INITIALIZATION
     ================================ -->

<script>

    /* -------------------------------
       Mobile setup
       ------------------------------- */

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

        var meta = document.createElement("meta");

        meta.name = "viewport";

        meta.content =
            "width=device-width, " +
            "height=device-height, " +
            "initial-scale=1.0, " +
            "user-scalable=no, " +
            "shrink-to-fit=yes";

        document
            .getElementsByTagName("head")[0]
            .appendChild(meta);


        var canvas =
            document.querySelector("#unity-canvas");

        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
    }


    /* -------------------------------
       Loading screen elements
       ------------------------------- */

    const loadingScreen =
        document.getElementById("loading-screen");

    const loadingProgress =
        document.getElementById("loading-progress");

    const loadingPercent =
        document.getElementById("loading-percent");

    const loadingStatus =
        document.getElementById("loading-status");


    /* -------------------------------
       Unity loading progress
       ------------------------------- */

    function updateLoading(progress) {

        /*
         * Unity gives us a value between
         * 0.0 and 1.0.
         */

        const percent =
            Math.floor(progress * 100);


        loadingProgress.style.width =
            percent + "%";


        loadingPercent.textContent =
            percent + "%";


        if (percent < 100) {

            loadingStatus.textContent =
                "Loading game...";

        } else {

            loadingStatus.textContent =
                "Starting game...";
        }
    }


    /* -------------------------------
       Start Unity
       ------------------------------- */

    createUnityInstance(

        document.querySelector("#unity-canvas"),

        {
            arguments: [],

            dataUrl:
                "Build/V16.76.data",

            frameworkUrl:
                "Build/V16.76.framework.js",

            codeUrl:
                "Build/V16.76.wasm",

            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "Ardent Fields",

            productName:
                "HolderOfPlace",

            productVersion:
                "15"
        },

        /*
         * REAL UNITY LOADING PROGRESS
         */
        updateLoading

    ).then(function (unityInstance) {

        /* ---------------------------
           Unity finished loading
           --------------------------- */

        loadingProgress.style.width =
            "100%";

        loadingPercent.textContent =
            "100%";

        loadingStatus.textContent =
            "Game ready!";


        /*
         * Give Unity a tiny moment to
         * render its first frame before
         * removing the loading screen.
         */

        setTimeout(function () {

            loadingScreen.style.opacity =
                "0";


            setTimeout(function () {

                loadingScreen.remove();

            }, 300);

        }, 300);


    }).catch(function (message) {

        /* ---------------------------
           Loading error
           --------------------------- */

        console.error(
            "Unity failed to load:",
            message
        );


        loadingStatus.textContent =
            "Failed to load the game.";

        loadingPercent.textContent =
            "";

    });

</script>
