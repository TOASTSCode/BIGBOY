<title>Backrooms</title>

<style>
    html,
    body {
        background: #000;
        width: 100%;

        overflow: hidden;
        padding: 0;
        margin: 0;

    div#gameContainer {
        background: transparent !important;

    div#gameContainer canvas {

    /* ================================
       LOADING SCREEN
       ================================ */

    #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;
        color: #fff;

        font-family: Arial, sans-serif;

        opacity: 1;
        transition: opacity 0.3s ease;
    }

    #loading-container {
        width: min(500px, 80vw);
        text-align: center;
    }

    #loading-title {
        font-size: 28px;

    #loading-bar {
        width: 100%;

        border-radius: 10px;

```
<!-- ================================
     LOADING SCREEN
     ================================ -->

<div id="loading-screen">

    <div id="loading-container">

        <div id="loading-title">
            Loading Backrooms...
        </div>

        <div id="loading-bar">
            <div id="loading-progress"></div>
        </div>

        <div id="loading-status">
            Preparing game...
        </div>

        <div id="loading-percent">
            0%
        </div>

    </div>

</div>


<!-- ================================
     UNITY GAME
     ================================ -->

<div id="gameContainer">

    <canvas id="unity-canvas"></canvas>

</div>


<!-- ================================
     UNITY LOADER
     
     IMPORTANT:
     The loader MUST be loaded before
     createUnityInstance() is called.
     ================================ -->

<script src="Build/br-webgl.loader.js"></script>


<!-- ================================
     UNITY INITIALIZATION
     ================================ -->

<script>

    /* -------------------------------
       Loading screen elements
       ------------------------------- */

    const loadingScreen =
        document.getElementById("loading-screen");

    const loadingProgress =
        document.getElementById("loading-progress");

    const loadingPercent =
        document.getElementById("loading-percent");

    const loadingStatus =
        document.getElementById("loading-status");


    /* -------------------------------
       Unity loading progress
       ------------------------------- */

    function updateLoading(progress) {

        const percent =
            Math.floor(progress * 100);

        loadingProgress.style.width =
            percent + "%";

        loadingPercent.textContent =
            percent + "%";


        if (percent < 100) {

            loadingStatus.textContent =
                "Loading game...";

        } else {

            loadingStatus.textContent =
                "Starting game...";
        }
    }


    /* -------------------------------
       Start Unity
       ------------------------------- */

    createUnityInstance(

        document.querySelector("#unity-canvas"),

        {
            dataUrl:
                "Build/br-webgl.data.gz",

            frameworkUrl:
                "Build/br-webgl.framework.js",

            codeUrl:
                "Build/br-webgl.wasm.gz",

            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "DefaultCompany",

            productName:
                "Backrooms",

            productVersion:
                "0.1"
        },

        /*
         * Unity's real loading progress
         */
        updateLoading

    ).then(function (instance) {

        /* ---------------------------
           Unity finished loading
           --------------------------- */

        loadingProgress.style.width =
            "100%";

        loadingPercent.textContent =
            "100%";

        loadingStatus.textContent =
            "Game ready!";


        /* ---------------------------
           Preserve original resizing
           --------------------------- */

        var canvas =
            instance.Module.canvas;

        var container =
            canvas.parentElement;


        function onResize() {

            var w;
            var h;


            if (scaleToFit) {

                w = window.innerWidth;
                h = window.innerHeight;


                var r = 720 / 1280;


                if (w * r > window.innerHeight) {

                    w = Math.min(
                        w,
                        Math.ceil(h / r)
                    );
                }


                h = Math.floor(w * r);

            } else {

                w = 1280;
                h = 720;
            }


            container.style.width =
                canvas.style.width =
                w + "px";


            container.style.height =
                canvas.style.height =
                h + "px";


            container.style.top =
                Math.floor(
                    (window.innerHeight - h) / 2
                ) + "px";


            container.style.left =
                Math.floor(
                    (window.innerWidth - w) / 2
                ) + "px";
        }


        var scaleToFit;

        try {

            scaleToFit =
                !!JSON.parse("");

        } catch (e) {

            scaleToFit = true;
        }


        window.addEventListener(
            "resize",
            onResize
        );


        onResize();


        /* ---------------------------
           Fade out loading screen
           --------------------------- */

        setTimeout(function () {

            loadingScreen.style.opacity =
                "0";


            setTimeout(function () {

                loadingScreen.remove();

            }, 300);

        }, 300);


    }).catch(function (message) {

        /* ---------------------------
           Unity loading error
           --------------------------- */

        console.error(
            "Unity failed to load:",
            message
        );


        loadingStatus.textContent =
            "Failed to load the game.";

        loadingPercent.textContent =
            "";

    });

</script>
